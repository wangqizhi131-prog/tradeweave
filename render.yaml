services:
  - type: web
    name: tradeweave-demo
    runtime: node
    plan: free
    healthCheckPath: /healthz
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: HOST
        value: 0.0.0.0
      - key: DISABLE_LOCAL_EDITOR
        value: "1"
      - key: PUBLIC_MAKER_DEMO
        value: "1"
      - key: DATA_DIR
        value: /tmp/tradeweave-data
      - key: MEDIA_DIR
        value: /tmp/tradeweave-media
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: AI_API_URL
        value: https://openrouter.ai/api/v1/chat/completions
      - key: AI_MODEL
        value: openrouter/free
      - key: AI_TOKEN_PARAMETER
        value: max_completion_tokens
      - key: AI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
